name: Validate scene

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scene
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read scene contract validator lock
        id: scene-contract-ref
        shell: bash
        run: |
          sha="$(node -e 'process.stdout.write(require("./source/scene-contract-lock.json").validatorCommit)')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid_scene_contract_validator_lock" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned scene contract validator
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/warm-modern-meeting-room-scene-factory
          ref: ${{ steps.scene-contract-ref.outputs.sha }}
          path: .scene-factory

      - name: Install scene contract validator dependencies
        run: pnpm --dir .scene-factory install --frozen-lockfile

      - name: Reject changes to published version paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-repository-boundary.mjs --base "$BASE_SHA"

      - name: Validate repository and release records
        env:
          SCENE_FACTORY_DIR: .scene-factory
        run: pnpm validate

      - name: Inspect GLB releases
        run: pnpm inspect

      - name: Run tests
        run: pnpm test

      - name: Download pinned Blender
        shell: bash
        env:
          BLENDER_ARCHIVE_SHA256: 95e3a2dfedba3bd32ca54fc355eac6b15a11986954ccb02815a07535d0120a25
        run: |
          archive="$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz
          printf '%s  %s\n' "$BLENDER_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender-4.5.12-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Verify every accepted release is reproducible
        shell: bash
        run: |
          node -e 'for (const { version } of require("./source/release-acceptance-index.json").releases) console.log(version)' |
          while IFS= read -r version; do
            node scripts/build-release.mjs --version "$version" --twice
          done

      - name: Read platform validator lock
        id: platform-ref
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < platform-validator.lock)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid_platform_validator_lock" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned platform validator
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: ${{ steps.platform-ref.outputs.sha }}
          path: .platform

      - name: Validate versioned visual capture patch
        shell: bash
        run: git -C .platform apply --check "$GITHUB_WORKSPACE/source/releases/0.3.0/platform-scene-visual-clean.patch"

      - name: Validate Scene Bundle contract when releases exist
        shell: bash
        run: |
          if ! compgen -G 'assets/scenes/*/*/scene.json' > /dev/null; then
            exit 0
          fi
          pnpm --dir .platform install --frozen-lockfile
          pnpm --dir .platform --filter @vrata/shared-types build
          pnpm --dir .platform --filter @vrata/templates build
          pnpm --dir .platform --filter @vrata/asset-pipeline build
          for manifest in assets/scenes/*/*/scene.json; do
            node .platform/packages/asset-pipeline/dist/cli.js scenes validate "$(dirname "$manifest")"
          done
